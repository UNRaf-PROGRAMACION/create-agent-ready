name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Checkout workshop presentation
        uses: actions/checkout@v4
        with:
          repository: UNRaf-PROGRAMACION/workshop-agentes-unraf
          ref: main
          path: workshop-source
          persist-credentials: false
      - name: Record workshop version
        working-directory: workshop-source
        run: |
          echo "### Presentación del workshop" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install workshop dependencies
        working-directory: workshop-source
        run: npm ci
      - name: Build workshop presentation
        working-directory: workshop-source
        run: npm run build
      - name: Include presentation in site
        run: |
          test -f workshop-source/dist/index.html
          mkdir -p dist/presentacion
          cp -a workshop-source/dist/. dist/presentacion/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
